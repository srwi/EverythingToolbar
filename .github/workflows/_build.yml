name: Generic Build

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner to build on (e.g. windows-2025, windows-11-arm)'
        required: true
        type: string
      arch:
        description: 'MSBuild platform / architecture (x64, arm64)'
        required: true
        type: string
      installer:
        description: 'Inno Setup script filename under Installer/'
        required: true
        type: string
      ref:
        description: 'Git ref to check out (defaults to the triggering ref)'
        required: false
        type: string
        default: ''
      sign:
        description: 'Sign assemblies with the certificate from secrets'
        required: false
        type: boolean
        default: false
      signpath:
        description: 'Sign installer using SignPath'
        required: false
        type: boolean
        default: false
      signpath_project_slug:
        description: 'SignPath project slug'
        required: false
        type: string
        default: 'EverythingToolbar'
      signpath_signing_policy_slug:
        description: 'SignPath signing policy slug'
        required: false
        type: string
        default: 'release-signing'
      installer_basename:
        description: 'If set, name the installer output file'
        required: false
        type: string
        default: ''
      upload_artifact:
        description: 'Upload the installer as a build artifact'
        required: false
        type: boolean
        default: false
      artifact_name:
        description: 'Name of the uploaded artifact'
        required: false
        type: string
        default: ''
    secrets:
      PFX_CERTIFICATE_FILE:
        description: 'Base64-encoded strong-name key, required when sign is true'
        required: false
      SIGNPATH_API_TOKEN:
        description: 'SignPath API token'
        required: false
      SIGNPATH_ORGANIZATION_ID:
        description: 'SignPath organization ID'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet dependencies
        run: nuget restore

      - name: Decode certificate
        if: ${{ inputs.sign }}
        shell: bash
        env:
          PFX_CERTIFICATE_FILE: ${{ secrets.PFX_CERTIFICATE_FILE }}
        run: echo "$PFX_CERTIFICATE_FILE" | base64 --decode > ./EverythingToolbar.snk

      - name: Build all
        run: MSBuild $Env:GITHUB_WORKSPACE /p:Configuration=Release /p:Platform=${{ inputs.arch }} /p:SignAssembly=${{ inputs.sign }} /warnaserror:IDE0005,IDE0051,IDE0052,IDE0035,IDE0059,IDE0161,IDE1006,nullable

      - name: Install Inno Setup
        run: choco install innosetup -y --version 6.7.1 --allow-downgrade

      - name: Build installer
        run: iscc ${{ inputs.installer_basename != '' && format('/F"{0}"', inputs.installer_basename) || '' }} "Installer\${{ inputs.installer }}"

      - name: Upload unsigned artifact for SignPath
        if: ${{ inputs.signpath }}
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ inputs.artifact_name }}
          path: Installer/output/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        if: ${{ inputs.signpath }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ inputs.signpath_project_slug }}
          signing-policy-slug: ${{ inputs.signpath_signing_policy_slug }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: Installer/signed-output

      - name: Replace unsigned installer with signed installer
        if: ${{ inputs.signpath }}
        shell: pwsh
        run: |
          Move-Item -Path "Installer/signed-output/*.exe" -Destination "Installer/output/" -Force

      - name: Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          if-no-files-found: error
          path: Installer/output/*.exe
          archive: false
          
