name: Publish release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag to build the release for'
        required: true

permissions:
  contents: read

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            installer: Installer-x64.iss
          - runner: windows-11-arm
            arch: arm64
            installer: Installer-arm64.iss
    uses: ./.github/workflows/_build.yml
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      installer: ${{ matrix.installer }}
      ref: ${{ inputs.version_tag || github.ref_name }}
      sign: true
      installer_basename: EverythingToolbar-${{ inputs.version_tag || github.ref_name }}-${{ matrix.arch }}
      upload_artifact: true
      artifact_name: EverythingToolbar ${{ inputs.version_tag || github.ref_name }} ${{ matrix.arch }}
    secrets:
      PFX_CERTIFICATE_FILE: ${{ secrets.PFX_CERTIFICATE_FILE }}

  publish:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EverythingToolbar *
          merge-multiple: true
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.exe

      - name: Create release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: |
          cat > notes.md <<EOF
          <details>
          <summary>How to verify your download</summary>

          Every installer here comes with a [build provenance attestation](https://docs.github.com/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds): a signed record proving it was built by this repository's release workflow from this repository's source, and has not been modified since. To check it, install the [GitHub CLI](https://cli.github.com) and run:

          \`\`\`
          gh attestation verify EverythingToolbar-$VERSION_TAG-x64.exe --repo $GH_REPO
          \`\`\`

          Substitute the name of the file you actually downloaded.
          </details>
          EOF

          gh release create "$VERSION_TAG" \
            artifacts/*.exe \
            --draft \
            --title "$VERSION_TAG" \
            --notes-file notes.md
